x-zenith:
  catalog:
    name: Scrooge Dashboard
    description: See upcoming Stripe subscription charges, trial conversions, and payment retries on a calendar.
    detail: >-
      Scrooge Dashboard gives you a read-only calendar of upcoming charges for one
      Stripe account. Review subscription renewals, first charges after trials,
      and scheduled payment retries by day. Amounts are grouped by currency.
      Dates show customer charges rather than bank payout settlement dates.
      Connect a read-only restricted Stripe key, or explore sample data without one.
    authors: [Isobel McRae]
    tags: [finance, stripe, dashboard]
    source: https://github.com/isobelmcrae/scrooge-dashboard-public
    license: UNLICENSED
  expose:
    - service: app
      port: 8080
      web: true
  env:
    STRIPE_API_KEY:
      input:
        label: Stripe restricted API key
        description: Read-only restricted key. Leave blank for demo mode.
        required: false
        secret: true

services:
  app:
    image: ghcr.io/isobelmcrae/scrooge-dashboard-public@sha256:b1259f77296feff95e1da6163c787f2d18b257e565d28bf2e8bd53dcfbe06939
